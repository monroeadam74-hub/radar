name: radar

on:
  # По расписанию обновляются только профили (раз в 3 дня, 04:23 UTC = 07:23 МСК).
  # Поиск по ключам — только вручную (кнопки на сайте).
  schedule:
    - cron: "23 4 */3 * *"
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуска
    inputs:
      mode:
        description: "full — поиск + разбор; analyze — только разобрать найденное; profiles — обновить профили; thumbs — обложки TikTok"
        default: "full"
      max_analyze:
        description: "Сколько роликов разобрать за запуск (пусто = из настроек)"
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_MODE: ${{ inputs.mode || (github.event_name == 'schedule' && 'profiles') || 'full' }}
          RADAR_MAX_ANALYZE: ${{ inputs.max_analyze }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-report
          path: report/
