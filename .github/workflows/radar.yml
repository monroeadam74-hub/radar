name: radar

on:
  # Расписание выключено. Чтобы включить обновление профилей раз в 3 дня — уберите # у двух строк ниже.
  schedule:
    - cron: "5 8 * * *"      # волна каждый день в 11:05 МСК (после обнуления дневного лимита Gemini). Выключить — закомментировать две строки
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуска
    inputs:
      mode:
        description: "full — поиск + разбор; analyze — только разобрать найденное; profiles — обновить профили; thumbs — обложки TikTok; directions — разметить направления; visuals — ведущий и визуальный приём"
        default: "full"
      import_run:
        description: "Профили: взять данные уже оплаченного запуска Apify (ID или last) вместо нового сбора"
        default: ""
      budget:
        description: "Потолок трат Apify для исследований, $ (medsnow)"
        default: "0"
      igtest:
        description: "Тест сборщиков Instagram (через запятую)"
        default: ""
      wave:
        description: "Волна: сколько аккаунтов взять (пусто = 25)"
        default: ""
      max_analyze:
        description: "Сколько роликов разобрать за запуск (пусто = из настроек)"
        default: ""
      listfile:
        description: "Волна: файл списка в research/ (пусто = из переменной репозитория или wave_list.json)"
        default: ""
      paid_cap:
        description: "Волна: общий потолок трат платного ключа Gemini, $ (пусто = из настроек, 45)"
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_KEY_PAID: ${{ secrets.GEMINI_KEY_PAID }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_MODE: ${{ inputs.mode || (github.event_name == 'schedule' && 'wave') || 'full' }}
          RADAR_MAX_ANALYZE: ${{ inputs.max_analyze }}
          RADAR_IMPORT_RUN: ${{ inputs.import_run }}
          RADAR_IGTEST: ${{ inputs.igtest }}
          RADAR_BUDGET: ${{ inputs.budget }}
          RADAR_WAVE: ${{ inputs.wave }}
          RADAR_LISTFILE: ${{ inputs.listfile || vars.RADAR_LISTFILE }}
          RADAR_PAID_CAP: ${{ inputs.paid_cap }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-report
          path: report/
