settings:
  min_views: 1000000        # порог просмотров
  months_back: 6            # искать ролики не старше N месяцев
  max_duration_sec: 180     # Shorts/рилсы до 3 минут
  langs: ["en"]             # нужные языки (en, es, ...)
  yt_region: "US"
  max_analyze_per_run: 30   # максимум роликов на полный ИИ-разбор за один запуск (контроль расходов)
  tt_results_per_keyword: 30
  tt_region: "US"
  digest_top: 10            # сколько роликов показывать в Telegram-дайджесте
  search_youtube: true      # искать новые Shorts
  search_tiktok: true       # искать новые TikTok (тратит Apify)
  analyze_tiktok: true      # разбирать TikTok (скачивание видео тратит Apify)
  # --- профили (слежка за аккаунтами)
  profile_deep_reels: 300     # глубокий скан: до N роликов…
  profile_deep_days: 365      # …или за 12 месяцев (что раньше закончится)
  profile_deep_min_median: 20000  # глубокий скан только у сильных профилей (медиана просмотров >= N)
  profile_update_reels: 50    # раз в 3 дня: последние N роликов…
  profile_update_days: 30     # …но только за последний месяц (новые и поздние выстрелы)
  profile_outlier_min: 2      # выстрел: просмотры >= N × скользящая медиана
  profile_min_views: 100000   # и не меньше N просмотров
  profile_window: 15          # скользящая медиана: ±N соседних роликов по дате
  profile_young_days: 3       # ролики моложе N дней не участвуют в медиане и пока не выстрелы
  profile_max_analyze: 1000   # предохранитель: максимум разборов за запуск
  ig_actor: "scrapesmith/instagram-reels-scraper"        # дешёвый сборщик (~$0.45 / 1000)

verticals:
  joints:
    name: "Суставы"
    keywords:
      - knee pain
      - knee pain relief
      - knee pain exercises
      - knee pain at night
      - cracking knees
      - stiff knees morning
      - joint pain relief
      - joint pain remedies
      - arthritis pain
      - arthritis exercises
      - osteoarthritis knee
      - bone on bone knee
      - cartilage repair
      - hip pain relief
      - collagen for joints
      - turmeric for joint pain
      - foods that cause joint pain
      - exercises for seniors knees
    nutra_scale: |
      5 = тема суставов/боли, ЦА 45+, механика естественно подводит к «средству»/добавке, можно повторить без шока и запрещённых заявлений;
      4 = тема суставов/боли, механика переносима, но нужна заметная адаптация;
      3 = смежная тема (спина, шея, осанка, общее здоровье 50+) или ЦА моложе 40 — ролики про шею/спину/осанку БЕЗ колен и суставов получают максимум 3;
      2 = здоровье в целом, к суставам притянуто;
      1 = не подходит (юмор, травмы спортсменов, другая тема).

